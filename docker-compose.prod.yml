# Production compose file — Phase 17.5 audit fix.
#
# Differences from docker-compose.yml (dev):
#   - restart: unless-stopped on every service, not just db, so a crashed
#     backend/frontend container recovers without manual intervention.
#   - No credentials or secrets are hardcoded here — POSTGRES_* and the
#     NEXT_PUBLIC_* build args are all read from the shell/CI environment
#     or a root-level .env file (see .env.prod.example), which is
#     git-ignored. docker compose automatically loads a file literally
#     named .env in the same directory as this file for ${VAR}
#     substitution.
#   - DISABLE_DOCS=true — hides /docs and /redoc in production.
#   - Backend still reads fiddlers_green-backend/.env via env_file for
#     JWT_SECRET, ANTHROPIC_API_KEY, SMTP_*, and FRONTEND_URL — same
#     pattern as dev, just with real production values in that file.
#
# Usage:
#   cp .env.prod.example .env
#   # fill in real values in .env and fiddlers_green-backend/.env
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./fiddlers_green-backend
    container_name: fiddlers-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./fiddlers_green-backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DISABLE_DOCS: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./fiddlers_green-frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: fiddlers-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./fiddlers_green-frontend/.env.local
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
